spring.application.name=Server

# DevTools：classpath 被 mvn clean / IDE 重建时易触发热重启，若此时 target/classes 不完整会报 ClassNotFoundException。
# 不需要文件变更自动重启时建议关闭；需要热重启时改为 true 并避免运行中执行 clean。
